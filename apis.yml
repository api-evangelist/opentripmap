apis:
  - aid: opentripmap:opentripmap-api
    name: OpenTripMap API
    description: >
      REST API providing access to over 10 million tourist attractions and points
      of interest worldwide. Supports place list queries by bounding box, radius,
      name, category, and rating; place detail lookups by unique xid identifier;
      autosuggest for partial search terms; and geographic coordinate lookups for
      place names. Responses include coordinates, categories, ratings, descriptions,
      Wikipedia URLs, and OpenStreetMap identifiers.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
