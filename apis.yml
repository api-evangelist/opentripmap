aid: opentripmap
name: OpenTripMap
description: >
  OpenTripMap provides a travel points of interest REST API with access to over
  10 million POIs worldwide including attractions, restaurants, hotels, museums,
  and natural features. The API integrates data from OpenStreetMap, Wikidata,
  Wikipedia, and government cultural and environmental registries to deliver rich
  POI details with descriptions, coordinates, categorization, and Wikipedia links
  across more than 150 attraction types. Developers can query by bounding box,
  radius, name, category, and rating, with responses available in JSON and GeoJSON
  formats. Licensed under the Open Data Commons Open Database License (ODbL),
  which permits caching, indexing, and redistribution of data.
